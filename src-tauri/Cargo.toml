[package]
name = "aimux-desktop"
version = "0.1.0"
description = "aimux desktop app"
authors = ["BrimVeyn"]
edition = "2021"

[lib]
name = "aimux_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
glob = "0.3.4"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# WebKit's cursor fix for pages laid over the app (browser.rs); Tauri already builds it.
objc2 = "0.6"
